function rng(seed) {             // mulberry32: same particles on every load

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, dw, dh);
    g.setTransform(s, 0, 0, s, 0, 0);
    g.beginPath();
    for (const p of polys) { g.moveTo(...p[0]); for (const q of p) g.lineTo(...q); g.closePath(); }
    g.fillStyle = g.strokeStyle = '#fff';
    g.fill();
    if (grow) { g.lineJoin = 'round'; g.lineWidth = grow * 2; g.stroke(); }
    return g.getImageData(0, 0, dw, dh).data;
  };
  const owner = new Uint8Array(dw * dh);   // 0 = empty, else shape index + 1
  const rim = new Uint8Array(dw * dh);     // 1 = soft margin just outside the shape
  // Margins first, then fills, so a fill always beats a neighbour's margin.
  SHAPES.forEach((sh, i) => {
    const m = paint(sh.mask, 10);
    for (let p = 0; p < owner.length; p++) if (m[p * 4 + 3] > 127) { owner[p] = i + 1; rim[p] = 1; }
  });
  SHAPES.forEach((sh, i) => {
    const m = paint(sh.mask, 0);
    for (let p = 0; p < owner.length; p++) if (m[p * 4 + 3] > 127) { owner[p] = i + 1; rim[p] = 0; }
  });
  return { owner, rim };
}

function boxBlur(src, w, h, r, passes = 3) {
  let a = Float32Array.from(src), b = new Float32Array(a.length);
  const norm = 1 / (2 * r + 1);
  for (let n = 0; n < passes; n++) {
    for (let y = 0; y < h; y++) {           // horizontal
      let acc = 0;
      for (let x = -r; x <= r; x++) acc += a[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        b[y * w + x] = acc * norm;
        acc += a[y * w + Math.min(w - 1, x + r + 1)] - a[y * w + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {           // vertical
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += b[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        a[y * w + x] = acc * norm;
        acc += b[Math.min(h - 1, y + r + 1) * w + x] - b[Math.max(0, y - r) * w + x];
      }
    }
  }
  return a;
}

/* -------------------------------------------------------- low-poly mesh */

function delaunay(pts) {                       // Bowyer–Watson, fine for a few hundred points
  const n = pts.length;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const d = Math.max(x1 - x0, y1 - y0) * 20, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const P = pts.concat([[mx - d, my - d], [mx + d, my - d], [mx, my + d]]);
  const circ = t => {
    const [ax, ay] = P[t[0]], [bx, by] = P[t[1]], [cx, cy] = P[t[2]];
    const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / D;
    const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / D;
    return [ux, uy, (ax - ux) ** 2 + (ay - uy) ** 2];
  };
  let tris = [{ v: [n, n + 1, n + 2] }];
  tris[0].c = circ(tris[0].v);
  for (let i = 0; i < n; i++) {
    const [px, py] = P[i];
    const keep = [], edges = new Map();
    for (const t of tris) {
      if ((px - t.c[0]) ** 2 + (py - t.c[1]) ** 2 < t.c[2]) {
        for (const [a, b] of [[t.v[0], t.v[1]], [t.v[1], t.v[2]], [t.v[2], t.v[0]]]) {
          const k = a < b ? a + ',' + b : b + ',' + a;
          edges.set(k, edges.has(k) ? null : [a, b]);
        }
      } else keep.push(t);
    }
    for (const e of edges.values()) if (e) { const t = { v: [e[0], e[1], i] }; t.c = circ(t.v); keep.push(t); }
    tris = keep;
  }
  return tris.map(t => t.v).filter(v => v[0] < n && v[1] < n && v[2] < n);
}

function lowPoly(poly, spacing) {
  // Tiny jitter breaks the cocircular/collinear runs (arcs, straight edges) that trip up Delaunay.
  const ring = resample(poly, spacing * 0.75).map(([x, y]) => [x + (rand() - 0.5) * 0.6, y + (rand() - 0.5) * 0.6]);
  const pts = ring.slice();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  for (let y = y0, row = 0; y < y1; y += spacing * 0.86, row++) {
    for (let x = x0 + (row % 2) * spacing / 2; x < x1; x += spacing) {
      const p = [x + (rand() - 0.5) * spacing * 0.55, y + (rand() - 0.5) * spacing * 0.55];
      if (inside(p, poly) && distToPoly(p, poly) > spacing * 0.38) pts.push(p);
    }
  }
  const tris = delaunay(pts).filter(([a, b, c]) =>
    inside([(pts[a][0] + pts[b][0] + pts[c][0]) / 3, (pts[a][1] + pts[b][1] + pts[c][1]) / 3], poly));
  return { pts, tris, ring };
}

/* ---------------------------------------------------------------- scene */

const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: STILL });
} catch (err) {
  canvas.remove();
  document.body.insertAdjacentHTML('beforeend', '<p class="fallback">This animation needs WebGL, which is not available in this browser.</p>');
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.5 : 2));
// The composer's linear target receives the clear colour without decoding, and OutputPass encodes it
// once more on the way out; hand it #010101 pre-linearised so the final background is exactly #010101.
const bgLin = new THREE.Color(PALETTE.bg);
renderer.setClearColor(new THREE.Color().setRGB(bgLin.r, bgLin.g, bgLin.b, THREE.SRGBColorSpace), 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 50, D0 * 3);
const symbol = new THREE.Group();
scene.add(symbol);

const colBlue = new THREE.Color(PALETTE.blue), colGreen = new THREE.Color(PALETTE.green), colWhite = new THREE.Color(PALETTE.white);
// The artwork's blue side glows brighter than its green side; lift blue so the two read as equals.
const tint = (g, w, out = new THREE.Color()) =>
  out.copy(colBlue).lerp(colGreen, g).multiplyScalar(1.35 - 0.35 * g).lerp(colWhite, w);

const { lum, w: DW, h: DH, img: densityImg } = await loadDensity();
const { owner, rim } = makeMasks(DW, DH);
const S = DW / W;                                   // density px per artboard px
const at = (u, v) => Math.min(DH - 1, Math.max(0, v * S | 0)) * DW + Math.min(DW - 1, Math.max(0, u * S | 0));

// Car volume: a soft dome from the blurred silhouette.
const carIndex = SHAPES.findIndex(s => s.key === 'car') + 1;
const carDome = boxBlur(owner.map((o, p) => o === carIndex && !rim[p] ? 1 : 0), DW, DH, 32);
const carZ = (u, v) => -10 + 62 * smooth(0.02, 0.85, carDome[at(u, v)]);

function zOf(shape, u, v) {
  if (shape.key === 'car') return carZ(u, v);
  if (shape.key === 'battery') {
    if (inside([u, v], BATTERY.terminal)) return -26;
    if (v < 598) return -14;
    const r = Math.hypot(u - BATTERY.ring.c[0], v - BATTERY.ring.c[1]);
    return (Math.abs(r - BATTERY.ring.r + 5) < 9 || inside([u, v], BATTERY.bolt)) ? 8 : 0;
  }
  return shape.solids[0].z[0];
}

/* particles */
const P = { pos: [], col: [], size: [], alpha: [], seed: [], from: [] };
const tmp = new THREE.Color();
function addParticle(u, v, z, color, size, alpha, amp) {
  P.pos.push(...toWorld(u, v, z));
  P.col.push(color.r, color.g, color.b);
  P.size.push(size);
  P.alpha.push(alpha);
  P.seed.push(amp, 0.35 + rand() * 0.8, rand() * Math.PI * 2, rand());
  const a = rand() * Math.PI * 2, b = Math.acos(2 * rand() - 1), r = 90 + rand() * 260;
  P.from.push(r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b) + 120);
}

// Inverse-CDF sampler over the density map: returns pixel indices in proportion to weight(p).
const sampler = weight => {
  const cdf = new Float64Array(DW * DH);
  let acc = 0;
  for (let p = 0; p < cdf.length; p++) { acc += weight(p); cdf[p] = acc; }
  return () => {
    const r = rand() * acc;
    let lo = 0, hi = cdf.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < r) lo = mid + 1; else hi = mid; }
    return lo;
  };
};
// 1. Surface dots, importance-sampled from the artwork's own brightness inside each shape.
{
  const BLACK = 16;
  const BODY_A = 2, SPARK_A = 1.25, HAZE_A = 0.5;
  // Body: evenly spread colour dots that give each band its blue/green surface.
  const soft = boxBlur(lum, DW, DH, 4, 2);
  const body = sampler(p => owner[p] ? Math.max(0, soft[p] - BLACK) / (255 - BLACK) * (rim[p] ? 0.5 : 1) : 0);
  // Haze: wide, faint sprites that melt into the frosted base tone of each band.
  for (let i = 0; i < COUNT * 0.15; i++) {
    const p = body();
    const u = (p % DW + rand()) / S, v = ((p / DW | 0) + rand()) / S;
    const shape = SHAPES[owner[p] - 1];
    tint(shape.green(u), 0, tmp);
    addParticle(u, v, zOf(shape, u, v) - 2, tmp, 9 + rand() * 8, HAZE_A * (shape.haze ?? 1) * smooth(10, 140, soft[p]), 0.5 + rand());
  }
  for (let i = 0; i < COUNT * 0.42; i++) {
    const p = body();
    const u = (p % DW + rand()) / S, v = ((p / DW | 0) + rand()) / S;
    const shape = SHAPES[owner[p] - 1];
    tint(shape.green(u), shape.white * 0.15, tmp);
    addParticle(u, v, zOf(shape, u, v) + (rand() - 0.5) * 8, tmp,
      2.4 + rand() * 1.4, BODY_A * (shape.gain ?? 1) * (0.45 + 0.55 * smooth(20, 170, soft[p])), 0.7 + rand() * 1.6);
  }
  // Sparkle: crisp bright dots that trace the artwork's highlights and edges.
  const spark = sampler(p => owner[p] ? (Math.max(0, lum[p] - BLACK) / (255 - BLACK)) ** 1.35 * (rim[p] ? 0.6 : 1) : 0);
  for (let i = 0; i < COUNT * 0.43; i++) {
    const p = spark();
    const u = (p % DW + rand()) / S, v = ((p / DW | 0) + rand()) / S;
    const shape = SHAPES[owner[p] - 1];
    const l = lum[p], b = smooth(40, 250, l);
    const white = clamp01(shape.white * 0.5 + 0.6 * smooth(150, 252, l) + (rand() < 0.05 ? 0.3 : 0));
    tint(shape.green(u), white, tmp);
    addParticle(u, v, zOf(shape, u, v) + (rand() - 0.5) * 8, tmp,
      (2 + 2.2 * b + rand() * 0.8) * (shape.dot ?? 1), SPARK_A * (shape.gain ?? 1) * (0.25 + 0.75 * b), 0.6 + rand() * 1.4);
  }
}

// 2. Edge light: walk each traced outline, snap to the brightest line within a few px of it
//    in the artwork, and lay crisp dots plus a coloured glow wherever that edge glows.
{
  const EDGE_A = 1.2;
  for (const [si, shape] of SHAPES.entries()) {
    for (const solid of shape.solids) {
      if (!solid.edge) continue;
      const ring = resample(solid.poly, 1.4);
      ring.forEach(([u, v], i) => {
        const [nu, nv] = ring[(i + 1) % ring.length], [pu, pv] = ring[(i + ring.length - 1) % ring.length];
        let tx = nu - pu, ty = nv - pv; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        let best = 0, bt = 0;
        for (let t = -6; t <= 6; t += 1) { const l = lum[at(u - ty * t, v + tx * t)]; if (l > best) { best = l; bt = t; } }
        if (best < 110) return;
        const j = bt + (rand() - 0.5) * 1.6, x = u - ty * j, y = v + tx * j;
        if (owner[at(x, y)] !== si + 1) return;
        const e = smooth(110, 255, best);
        tint(shape.green(x), clamp01(0.3 + 0.55 * e), tmp);
        addParticle(x, y, zOf(shape, x, y) + 2, tmp, 2.2 + 1.4 * e, EDGE_A * e, 0.4 + rand() * 0.6);
        if (i % 4 === 0) {
          tint(shape.green(x), 0.04, tmp);
          addParticle(x, y, zOf(shape, x, y), tmp, 10 + rand() * 6, 0.24 * e * (shape.glow ?? 1), 0.4 + rand() * 0.5);
        }
      });
    }
  }
}

// 3. Coloured glow: big soft sprites on the artwork's brightest strokes (edges, headlight, badge).
{
  const pick = sampler(p => owner[p] && !rim[p] ? smooth(165, 255, lum[p]) ** 3 : 0);
  const glow = COARSE ? 5000 : 9000;
  for (let i = 0; i < glow; i++) {
    const p = pick();
    const u = (p % DW + rand()) / S, v = ((p / DW | 0) + rand()) / S;
    const shape = SHAPES[owner[p] - 1];
    tint(shape.green(u), shape.key === 'car' ? 0.35 : 0.06, tmp);
    addParticle(u, v, zOf(shape, u, v), tmp, 12 + rand() * 14, (0.07 + rand() * 0.06) * (shape.glow ?? 1), 0.5 + rand());
  }
}

// 4. Side walls: sparse dots through the thickness of each slab, only where that slab is visible.
for (const [si, shape] of SHAPES.entries()) {
  for (const solid of shape.solids) {
    if (solid.relief || solid.outline || solid.poly === BATTERY.bolt) continue;
    for (const [u, v] of resample(solid.poly, 3.2)) {
      if (owner[at(u, v)] !== si + 1) continue;
      tint(shape.green(u), shape.white * 0.6, tmp);
      addParticle(u, v, solid.z[1] + rand() * (solid.z[0] - solid.z[1]), tmp, 2.4 + rand(), 0.28, 0.6 + rand());
    }
  }
}

// 5. A light dust halo hugging the symbol (kept sparse on purpose).
{
  const near = boxBlur(owner.map(o => (o ? 1 : 0)), DW, DH, 68, 2);
  const pick = sampler(p => owner[p] ? 0 : near[p] ** 1.6 + 0.004);
  const dust = COARSE ? 1300 : 2200;
  for (let i = 0; i < dust; i++) {
    const p = pick();
    const u = (p % DW + rand()) / S, v = ((p / DW | 0) + rand()) / S;
    tint(smooth(780, 1300, u), 0.2 + rand() * 0.5, tmp);
    addParticle(u, v, gauss() * 90, tmp, 2.2 + rand() * 2.4, 0.15 + rand() * 0.4, 2 + rand() * 4);
  }
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(P.pos, 3));
pGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(P.col, 3));
pGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(P.size, 1));
pGeo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(P.alpha, 1));
pGeo.setAttribute('aSeed', new THREE.Float32BufferAttribute(P.seed, 4));
pGeo.setAttribute('aFrom', new THREE.Float32BufferAttribute(P.from, 3));

const uniforms = {
  uTime: { value: 0 }, uIntro: { value: 0 }, uPx: { value: 1 }, uCamDist: { value: D0 },
  uMotion: { value: REDUCED ? 0.25 : 1 },
};
const points = new THREE.Points(pGeo, new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,   // pure light: dots add up
  vertexShader: /* glsl */`
    uniform float uTime, uIntro, uPx, uCamDist, uMotion;
    attribute vec3 aColor, aFrom;
    attribute float aSize, aAlpha;
    attribute vec4 aSeed;                 // amplitude, frequency, phase, intro delay
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float t = uTime * aSeed.y, ph = aSeed.z;
      vec3 drift = vec3(sin(t + ph) + 0.45 * sin(1.73 * t + 2.1 * ph),
                        cos(0.91 * t + 1.3 * ph) + 0.45 * sin(1.37 * t + 0.7 * ph),
                        1.3 * sin(0.83 * t + 3.1 * ph));
      float k = clamp((uIntro - aSeed.w * 0.4) / 0.6, 0.0, 1.0);
      k = 1.0 - pow(1.0 - k, 3.0);
      vec3 p = position + drift * aSeed.x * uMotion + aFrom * (1.0 - k);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float px = aSize * uPx * uCamDist / -mv.z;
      gl_PointSize = max(px, 1.5);
      float twinkle = 0.8 + 0.2 * sin(uTime * aSeed.y * 2.3 + ph * 4.0);
      vAlpha = aAlpha * twinkle * k * min(1.0, px / 1.5);
      vColor = aColor;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord * 2.0 - 1.0;
      float d2 = dot(c, c);
      if (d2 > 1.0) discard;
      float a = exp(-d2 * 9.0) + 0.16 * exp(-d2 * 2.6);
      gl_FragColor = vec4(vColor * (a * vAlpha), 1.0);
    }`,
}));
symbol.add(points);

/* low-poly shell: near-invisible facets and lines that hold the shapes together */
{
  const linePos = [], lineCol = [], facePos = [], faceCol = [], occPos = [];
  const seg = (a, b, c) => { linePos.push(...a, ...b); lineCol.push(c.r, c.g, c.b, c.r, c.g, c.b); };
  for (const shape of SHAPES) {
    for (const solid of shape.solids) {
      const zf = solid.relief ? carZ : () => solid.z[0];
      const zb = solid.relief ? -24 : solid.z[1];
      const col = (u, k) => tint(shape.green(u), 0.05, new THREE.Color()).multiplyScalar(k);
      if (solid.outline) {
        solid.poly.forEach((p, i) => {
          const q = solid.poly[(i + 1) % solid.poly.length];
          seg(toWorld(...p, zf(...p)), toWorld(...q, zf(...q)), col(p[0], shape.line));
        });
        continue;
      }
      const { pts, tris, ring } = lowPoly(solid.poly, solid.grid);
      const seen = new Set();
      for (const t of tris) {
        const shade = (0.8 + rand() * 0.2) * shape.fill;
        for (let e = 0; e < 3; e++) {
          const a = t[e], b = t[(e + 1) % 3], key = a < b ? a + ',' + b : b + ',' + a;
          if (!seen.has(key)) { seen.add(key); seg(toWorld(...pts[a], zf(...pts[a])), toWorld(...pts[b], zf(...pts[b])), col(pts[a][0], shape.line)); }
          const p = pts[t[e]], c = col(p[0], shade);
          facePos.push(...toWorld(...p, zf(...p)));
          faceCol.push(c.r, c.g, c.b);
          occPos.push(...toWorld(...p, zf(...p) - 9));
        }
      }
      ring.forEach((p, i) => {                       // back outline + walls
        const q = ring[(i + 1) % ring.length];
        seg(toWorld(...p, zb), toWorld(...q, zb), col(p[0], 0.7 * shape.line));
        if (i % 2 === 0) seg(toWorld(...p, zf(...p)), toWorld(...p, zb), col(p[0], 0.6 * shape.line));
      });
    }
  }
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
  lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineCol, 3));
  const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: DEBUG ? 0.9 : 0.05,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position', new THREE.Float32BufferAttribute(facePos, 3));
  faceGeo.setAttribute('color', new THREE.Float32BufferAttribute(faceCol, 3));
  const faces = new THREE.Mesh(faceGeo, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }));
  // Depth-only copy just behind the front faces, so back edges and walls hide like a real solid.
  const occGeo = new THREE.BufferGeometry();
  occGeo.setAttribute('position', new THREE.Float32BufferAttribute(occPos, 3));
  const occluder = new THREE.Mesh(occGeo, new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide }));
  occluder.renderOrder = -1;
  symbol.add(occluder, faces, lines);
}

if (DEBUG) {
  const tex = new THREE.Texture(densityImg);
  tex.needsUpdate = true;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.45, depthTest: false }));
  plane.renderOrder = -2;
  symbol.add(plane);
}

/* post: soft bloom gives the dots their glow */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0, 0.45);
// Keep the glow tight around the dots: weight the small mips, starve the wide ones (no grey fog).
bloom.compositeMaterial.uniforms.bloomFactors.value = [1, 0.55, 0.2, 0.05, 0];
composer.addPass(bloom);
composer.addPass(new OutputPass());

function layout() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  // Landscape: the whole artboard, same framing as the artwork. Narrow screens: just the symbol.
  const box = aspect < 1.1
    ? { w: SYMBOL_BOX.w * 1.08, h: SYMBOL_BOX.h * 1.08, x: SYMBOL_BOX.cx - W / 2, y: H / 2 - SYMBOL_BOX.cy }
    : { w: W, h: H, x: 0, y: 0 };
  const dist = Math.max((box.h / 2) / TAN, (box.w / 2) / (TAN * aspect));
  camera.aspect = aspect;
  camera.position.set(box.x, box.y, dist);
  camera.lookAt(box.x, box.y, 0);
  camera.far = dist + 2000;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  uniforms.uPx.value = h * renderer.getPixelRatio() / (2 * dist * TAN);
  uniforms.uCamDist.value = dist;
}
layout();
addEventListener('resize', layout);

/* gentle pointer parallax; rests on the artwork's exact front view */
const pointer = { x: 0, y: 0, on: false };
addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth * 2 - 1;
  pointer.y = e.clientY / innerHeight * 2 - 1;
  pointer.on = true;
});
document.documentElement.addEventListener('pointerleave', () => { pointer.on = false; });
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.on = false; });
addEventListener('blur', () => { pointer.on = false; });

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  const ease = 1 - Math.exp(-dt * 2.6);
  uniforms.uTime.value = STILL ? 6 : t;
  uniforms.uIntro.value = STILL || REDUCED ? 1 : Math.min(1, t / 2.8);
  const ry = pointer.on && !STILL ? pointer.x * 0.16 : 0;
  const rx = pointer.on && !STILL ? pointer.y * 0.1 : 0;
  symbol.rotation.y += (ry - symbol.rotation.y) * ease;
  symbol.rotation.x += (rx - symbol.rotation.x) * ease;
  composer.render();
  requestAnimationFrame(frame);
}
frame();
canvas.dataset.particles = P.size.length;
document.documentElement.dataset.ready = 'true';
</script>
</body>
