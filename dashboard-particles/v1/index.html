<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const STILL = params.has('still');   // frozen front view, no intro or spin (screenshots)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;

// Artboard = the reference image (1451 x 1084 px). Every coordinate below is in its pixel space.
const W = 1451, H = 1084;
const PALETTE = { bg: '#010101', white: '#F2F2F2', silver: '#A7ABB0' };
const COUNT = Number(params.get('n')) || (COARSE ? 120000 : 260000);

// Camera: a narrow lens keeps the front view flat like the artwork while depth still reads on parallax.
const FOV = 16;
const TAN = Math.tan(FOV * Math.PI / 360);
const D0 = (H / 2) / TAN;
// x/y are pre-scaled by depth so the straight-on view lands every point exactly on its artboard pixel.
const toWorld = (u, v, z) => { const k = (D0 - z) / D0; return [(u - W / 2) * k, (H / 2 - v) * k, z]; };
const SYMBOL_BOX = { cx: 737, cy: 548, w: 1060, h: 960 };

/* ---------------------------------------------------------------- helpers */

function rng(seed) {             // mulberry32: same particles on every load
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(20261031);
const clamp01 = t => Math.min(1, Math.max(0, t));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---------------------------------------------------------- the symbol */
// Traced from the reference: the tilted panel slab with its rounded corners (its visible left edge
// included). The chart cards, lines and dots on its face come through as detail dots.

const PANEL = [
  [236, 285], [242, 266], [258, 256],          // top left
  [1205, 96], [1228, 100], [1238, 118],        // top right
  [1238, 790], [1232, 812], [1212, 822],       // bottom right
  [262, 1000], [243, 995], [236, 980],         // bottom left
];

// z = [front, back] of the part; follow = how far the artwork's own light and dark steer dot density
// (high here, so the dark screen stays dark and the charts read).
const SHAPES = [
  { key: 'panel', mask: [PANEL], z: [50, -50], follow: 0.8 },
];

/* ------------------------------------------------------ density + masks */

async function loadDensity() {
  const img = new Image();
  img.src = 'data:image/webp;base64,' + document.getElementById('density').textContent.trim();
  await img.decode();
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  const rgba = g.getImageData(0, 0, c.width, c.height).data;
  const lum = new Uint8Array(c.width * c.height);
  for (let i = 0; i < lum.length; i++) lum[i] = rgba[i * 4];
  return { lum, w: c.width, h: c.height };
}

function makeMasks(dw, dh) {
  const s = dw / W;
  const c = document.createElement('canvas');
  c.width = dw; c.height = dh;
  const g = c.getContext('2d', { willReadFrequently: true });
  const paint = (polys, grow) => {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, dw, dh);
    g.setTransform(s, 0, 0, s, 0, 0);
    g.beginPath();
    for (const p of polys) { g.moveTo(...p[0]); for (const q of p) g.lineTo(...q); g.closePath(); }
    g.fillStyle = g.strokeStyle = '#fff';
    g.fill();
    if (grow) { g.lineJoin = 'round'; g.lineWidth = grow * 2; g.stroke(); }
    return g.getImageData(0, 0, dw, dh).data;
  };
  const owner = new Uint8Array(dw * dh);   // 0 = empty, else shape index + 1
  const rim = new Uint8Array(dw * dh);     // 1 = soft margin just outside the shape
  // Margins first, then fills, so a fill always beats a neighbour's margin.
  SHAPES.forEach((sh, i) => {
    const m = paint(sh.mask, 10);
    for (let p = 0; p < owner.length; p++) if (m[p * 4 + 3] > 127) { owner[p] = i + 1; rim[p] = 1; }
  });
  SHAPES.forEach((sh, i) => {
    const m = paint(sh.mask, 0);
    for (let p = 0; p < owner.length; p++) if (m[p * 4 + 3] > 127) { owner[p] = i + 1; rim[p] = 0; }
  });
  return { owner, rim };
}

function boxBlur(src, w, h, r, passes = 3) {
  let a = Float32Array.from(src), b = new Float32Array(a.length);
  const norm = 1 / (2 * r + 1);
  for (let n = 0; n < passes; n++) {
    for (let y = 0; y < h; y++) {           // horizontal
      let acc = 0;
      for (let x = -r; x <= r; x++) acc += a[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        b[y * w + x] = acc * norm;
        acc += a[y * w + Math.min(w - 1, x + r + 1)] - a[y * w + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {           // vertical
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += b[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        a[y * w + x] = acc * norm;
        acc += b[Math.min(h - 1, y + r + 1) * w + x] - b[Math.max(0, y - r) * w + x];
      }
    }
  }
  return a;
}

/* ---------------------------------------------------------------- scene */

const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: STILL });
} catch (err) {
  canvas.remove();
  document.body.insertAdjacentHTML('beforeend', '<p class="fallback">This animation needs WebGL, which is not available in this browser.</p>');
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.5 : 2));
renderer.setClearColor(PALETTE.bg, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 50, D0 * 3);
const symbol = new THREE.Group();
scene.add(symbol);

const { lum, w: DW, h: DH } = await loadDensity();
const { owner, rim } = makeMasks(DW, DH);
const S = DW / W;                                   // density px per artboard px
const at = (u, v) => Math.min(DH - 1, Math.max(0, v * S | 0)) * DW + Math.min(DW - 1, Math.max(0, u * S | 0));
const soft = boxBlur(lum, DW, DH, 4, 2);            // local brightness, for density
const SILVER = new THREE.Color(PALETTE.silver).convertLinearToSRGB().r;   // grey levels, written straight to screen
const WHITE = new THREE.Color(PALETTE.white).convertLinearToSRGB().r;

// Distance from every owned pixel to the edge of its own shape (two-pass chamfer), for the rounded edges.
const dist = new Float32Array(DW * DH);
SHAPES.forEach((shape, si) => {
  let x0 = DW, y0 = DH, x1 = 0, y1 = 0;
  for (const poly of shape.mask) for (const [u, v] of poly) {
    x0 = Math.min(x0, u * S - 14 | 0); y0 = Math.min(y0, v * S - 14 | 0);
    x1 = Math.max(x1, u * S + 14 | 0); y1 = Math.max(y1, v * S + 14 | 0);
  }
  x0 = Math.max(1, x0); y0 = Math.max(1, y0); x1 = Math.min(DW - 2, x1); y1 = Math.min(DH - 2, y1);
  const own = p => owner[p] === si + 1 && !rim[p];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const p = y * DW + x; if (own(p)) dist[p] = 1e9; }
  const R2 = Math.SQRT2;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const p = y * DW + x; if (!own(p)) continue;
    dist[p] = Math.min(dist[p], (own(p - 1) ? dist[p - 1] : 0) + 1, (own(p - DW) ? dist[p - DW] : 0) + 1,
      (own(p - DW - 1) ? dist[p - DW - 1] : 0) + R2, (own(p - DW + 1) ? dist[p - DW + 1] : 0) + R2);
  }
  for (let y = y1; y >= y0; y--) for (let x = x1; x >= x0; x--) {
    const p = y * DW + x; if (!own(p)) continue;
    dist[p] = Math.min(dist[p], (own(p + 1) ? dist[p + 1] : 0) + 1, (own(p + DW) ? dist[p + DW] : 0) + 1,
      (own(p + DW + 1) ? dist[p + DW + 1] : 0) + R2, (own(p + DW - 1) ? dist[p + DW - 1] : 0) + R2);
  }
});

// [front, back] z of a part at an artboard point, before rounding.
const depthOf = shape => shape.z;

// Rounded slab: centre c, half-thickness h that eases to zero at the outline over radius R,
// plus the outward surface normal there. Normals light the dots; they never draw anything.
function form(shape, u, v, p) {
  const [f, b] = depthOf(shape, u, v), c = (f + b) / 2, half = (f - b) / 2;
  const R = Math.min(60, half * 0.8), t = Math.min(1, dist[p] / S / R), q = 1 - t;
  const h = half * Math.sqrt(1 - q * q);
  const slope = t < 1 ? Math.min(40, half / R * q / Math.sqrt(Math.max(1e-4, 1 - q * q))) : 0;
  const gu = (dist[p + 1] - dist[p - 1]) / 2, gv = (dist[p + DW] - dist[p - DW]) / 2;   // ∇d (image space)
  return { c, h, slope, gx: gu * slope, gy: -gv * slope };          // ∇d in world (y up), times dh/dd
}
const surfaceNormal = (fm, side) => {                                // side +1 = front, −1 = back
  const n = [-fm.gx, -fm.gy, side], l = Math.hypot(...n);
  return [n[0] / l, n[1] / l, n[2] / l];
};

/* particles */
const P = { pos: [], gray: [], size: [], alpha: [], seed: [], from: [], normal: [] };
function addParticle(u, v, z, gray, size, alpha, normal = [0, 0, 0]) {
  P.pos.push(...toWorld(u, v, z));
  P.gray.push(Math.min(WHITE, gray));
  P.size.push(size);
  P.alpha.push(alpha);
  P.normal.push(...normal);
  P.seed.push(0.35 + rand() * 0.9, 0.35 + rand() * 0.8, rand() * Math.PI * 2, rand());
  const a = rand() * Math.PI * 2, b = Math.acos(2 * rand() - 1), r = 90 + rand() * 260;
  P.from.push(r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b) + 120);
}

// Inverse-CDF sampler over the density map: returns pixel indices in proportion to weight(p).
const sampler = weight => {
  const cdf = new Float64Array(DW * DH);
  let acc = 0;
  for (let p = 0; p < cdf.length; p++) { acc += weight(p); cdf[p] = acc; }
  return () => {
    const r = rand() * acc;
    let lo = 0, hi = cdf.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < r) lo = mid + 1; else hi = mid; }
    return lo;
  };
};
const spot = p => [(p % DW + rand()) / S, ((p / DW | 0) + rand()) / S];

// Density inside a part: an even base, steered by the artwork's light and dark (shape.follow),
// broken up by the artwork's own fine grain so the surface reads uneven and granular.
const grain = p => Math.min(1.25, Math.max(0.3, 0.65 + (lum[p] - soft[p]) / 70));
const density = p => {
  const shape = SHAPES[owner[p] - 1];
  return ((1 - shape.follow) + shape.follow * smooth(12, 150, soft[p])) * grain(p);
};
const solid = p => owner[p] && !rim[p] && dist[p] > 0;

// 1. Surface shell: dots on the rounded front and back faces and around the rim.
//    Weighted by surface slope so the curved rim gets its share and the silhouette stays crisp.
{
  const pick = sampler(p => {
    if (!solid(p)) return 0;
    const fm = form(SHAPES[owner[p] - 1], (p % DW) / S, (p / DW | 0) / S, p);
    return density(p) * Math.min(4, Math.sqrt(1 + fm.slope * fm.slope));
  });
  for (let i = 0; i < COUNT * 0.58; i++) {
    const p = pick(), [u, v] = spot(p), shape = SHAPES[owner[p] - 1], fm = form(shape, u, v, p);
    const side = rand() < 0.6 ? 1 : -1;
    addParticle(u, v, fm.c + side * fm.h + (rand() - 0.5) * 2, SILVER + (WHITE - SILVER) * rand() ** 1.6,
      1.1 + 0.9 * rand() ** 2, 0.55 + 0.3 * rand(), surfaceNormal(fm, side));
  }
}

// 2. Volume: a sparser fill through the thickness, so each part is a solid cloud rather than a shell.
{
  const pick = sampler(p => solid(p) ? density(p) * form(SHAPES[owner[p] - 1], (p % DW) / S, (p / DW | 0) / S, p).h : 0);
  for (let i = 0; i < COUNT * 0.18; i++) {
    const p = pick(), [u, v] = spot(p), fm = form(SHAPES[owner[p] - 1], u, v, p);
    addParticle(u, v, fm.c + (rand() * 2 - 1) * fm.h, SILVER * (0.75 + 0.35 * rand()), 1 + 0.7 * rand() ** 2, 0.3 + 0.2 * rand());
  }
}

// 3. Detail: brighter dots on the front face where the artwork is brightest (car lines, headlight,
//    badge, battery rim), so the parts stay recognisable.
{
  const pick = sampler(p => solid(p) ? (Math.max(0, lum[p] - 16) / 239) ** 1.4 : 0);
  for (let i = 0; i < COUNT * 0.22; i++) {
    const p = pick(), [u, v] = spot(p), fm = form(SHAPES[owner[p] - 1], u, v, p);
    const b = smooth(60, 250, lum[p]);
    addParticle(u, v, fm.c + fm.h + rand() * 1.5, SILVER + (WHITE - SILVER) * (0.45 + 0.55 * b),
      1.2 + 0.8 * b + 0.3 * rand(), 0.55 + 0.4 * b, surfaceNormal(fm, 1));
  }
}

// 4. A few stray dots just outside the outlines (kept minimal on purpose).
{
  const pick = sampler(p => owner[p] && rim[p] ? 1 : 0);
  for (let i = 0; i < COUNT * 0.012; i++) {
    const p = pick(), [u, v] = spot(p), [f, b] = depthOf(SHAPES[owner[p] - 1], u, v);
    addParticle(u, v, (f + b) / 2 + (rand() - 0.5) * (f - b) * 0.5, SILVER * (0.6 + 0.3 * rand()), 1 + 0.5 * rand(), 0.25 + 0.2 * rand());
  }
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(P.pos, 3));
pGeo.setAttribute('aGray', new THREE.Float32BufferAttribute(P.gray, 1));
pGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(P.size, 1));
pGeo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(P.alpha, 1));
pGeo.setAttribute('aSeed', new THREE.Float32BufferAttribute(P.seed, 4));
pGeo.setAttribute('aFrom', new THREE.Float32BufferAttribute(P.from, 3));
pGeo.setAttribute('aNormal', new THREE.Float32BufferAttribute(P.normal, 3));

const uniforms = {
  uTime: { value: 0 }, uIntro: { value: 0 }, uPx: { value: 1 }, uCamDist: { value: D0 },
  uMotion: { value: REDUCED ? 0.25 : 1 },
};
symbol.add(new THREE.Points(pGeo, new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,   // light adds up, no halos
  vertexShader: /* glsl */`
    uniform float uTime, uIntro, uPx, uCamDist, uMotion;
    attribute vec3 aFrom, aNormal;        // aNormal: surface direction for shell dots, zero inside the volume
    attribute float aGray, aSize, aAlpha;
    attribute vec4 aSeed;                 // drift amplitude, frequency, phase, intro delay
    varying float vLight;
    const vec3 LIGHT = vec3(-0.45, 0.55, 0.70);   // soft key light from upper left, fixed to the camera
    const float EXPOSURE = 2.0;
    void main() {
      float t = uTime * aSeed.y, ph = aSeed.z;
      vec3 drift = vec3(sin(t + ph) + 0.45 * sin(1.73 * t + 2.1 * ph),
                        cos(0.91 * t + 1.3 * ph) + 0.45 * sin(1.37 * t + 0.7 * ph),
                        1.3 * sin(0.83 * t + 3.1 * ph));
      float k = clamp((uIntro - aSeed.w * 0.4) / 0.6, 0.0, 1.0);
      k = 1.0 - pow(1.0 - k, 3.0);
      vec3 p = position + drift * aSeed.x * uMotion + aFrom * (1.0 - k);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float px = aSize * uPx * uCamDist / -mv.z;
      gl_PointSize = max(px, 1.0);
      float shade = 0.6;
      if (dot(aNormal, aNormal) > 0.5) {
        vec3 n = normalize(normalMatrix * aNormal);
        float lambert = max(dot(n, normalize(LIGHT)), 0.0);
        float facing = smoothstep(-0.35, 0.35, dot(n, normalize(-mv.xyz)));   // faces turned away sit back
        shade = (0.38 + 0.62 * lambert) * mix(0.42, 1.0, facing);
      }
      float twinkle = 0.92 + 0.08 * sin(uTime * aSeed.y * 2.3 + ph * 4.0);
      vLight = EXPOSURE * aGray * shade * aAlpha * twinkle * k * min(1.0, px);     // sub-pixel dots dim instead of growing
    }`,
  fragmentShader: /* glsl */`
    varying float vLight;
    void main() {
      float d = length(gl_PointCoord * 2.0 - 1.0);
      if (d > 1.0) discard;
      gl_FragColor = vec4(vec3(vLight * (1.0 - smoothstep(0.55, 1.0, d))), 1.0);   // crisp dot, no glow
    }`,
})));

function layout() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  // Landscape: the whole artboard, same framing as the artwork. Narrow screens: just the symbol.
  const box = aspect < 1.1
    ? { w: SYMBOL_BOX.w * 1.08, h: SYMBOL_BOX.h * 1.08, x: SYMBOL_BOX.cx - W / 2, y: H / 2 - SYMBOL_BOX.cy }
    : { w: W, h: H, x: 0, y: 0 };
  const dist = Math.max((box.h / 2) / TAN, (box.w / 2) / (TAN * aspect));
  camera.aspect = aspect;
  camera.position.set(box.x, box.y, dist);
  camera.lookAt(box.x, box.y, 0);
  camera.far = dist + 2000;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  uniforms.uPx.value = h * renderer.getPixelRatio() / (2 * dist * TAN);
  uniforms.uCamDist.value = dist;
}
layout();
addEventListener('resize', layout);

/* 360° motion: the whole point cloud turns around its vertical axis, starting from the artwork's front view */
const SPIN_SECONDS = 14;                           // one full turn

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  uniforms.uTime.value = STILL ? 6 : t;
  uniforms.uIntro.value = STILL || REDUCED ? 1 : Math.min(1, t / 2.8);
  // The turn begins once the dots have gathered, so it always opens on the exact front view.
  const turn = STILL || REDUCED ? 0 : Math.max(0, t - 2.8) / SPIN_SECONDS;
  symbol.rotation.y = turn * Math.PI * 2;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
canvas.dataset.particles = P.size.length;
document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
