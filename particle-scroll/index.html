<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Particle Scroll</title>
<meta name="description" content="One 3D particle system that turns continuously and, as you scroll, dissolves the rupee into a cloud, reforms it as a neural brain, then as an EV battery swap.">
<style>
  /* One black stage pinned (sticky) inside a tall scroll section; released after the last formation. Single dark look by design. */
  :root{
    --bg:#000;
    --fg:#fff;
    --muted:rgba(255,255,255,.42);
    --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font-family:var(--ui);overscroll-behavior-y:none}
  .scrub{position:relative;height:600vh}
  .pin{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden}
  .stage{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tail{height:40vh}
  .cue{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    transition:opacity .6s ease;pointer-events:none}
  .cue i{display:block;width:1px;height:34px;background:linear-gradient(var(--muted),transparent);animation:cue 2.2s ease-in-out infinite}
  .cue.gone{opacity:0}
  @keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
  @media (prefers-reduced-motion:reduce){.cue i{animation:none}}
  .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>
  <section class="scrub" id="scrub">
    <div class="pin">
      <canvas class="stage" id="stage" role="img" aria-label="A particle rupee symbol that dissolves into a neural brain, then into an electric car and battery exchange, as you scroll"></canvas>
      <div class="cue" id="cue"><span>Scroll</span><i></i></div>
      <p class="fallback" id="fallback" hidden>This animation needs WebGL, which this browser has turned off.</p>
    </div>
  </section>
  <div class="tail" aria-hidden="true"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
